[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nettoolkit"
version = "0.2.0"
description = "A modular networking toolkit: subnet calculator, scanner, uptime monitor, speed logger."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
nettool = "nettoolkit.cli:main"

[tool.setuptools.packages.find]
include = ["nettoolkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
