name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

  package:
    name: install and smoke-test the built package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A normal (non-editable) install, from a different folder, so a file that is
      # missing from the package (for example the dashboard's HTML/JS) is caught.
      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          pip install .
          rm -rf nettoolkit   # make sure the installed copy is the one that gets imported

      - name: Smoke test
        run: |
          nettool --version
          nettool subnet 192.168.1.10/24
          nettool vlsm 192.168.10.0/24 -r Sales:50 -r IT:20
          nettool logscan examples/auth.sample.log --year 2026
          python - <<'EOF'
          from pathlib import Path
          from nettoolkit.dashboard.server import STATIC_DIR
          missing = [n for n in ("index.html", "app.js", "style.css") if not (STATIC_DIR / n).is_file()]
          assert not missing, f"dashboard files missing from the installed package: {missing}"
          print("dashboard static files are packaged")
          EOF

  frontend:
    name: dashboard JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check nettoolkit/dashboard/static/app.js
